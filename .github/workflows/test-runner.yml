name: Kotakin Mobile E2E Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      feature:
        description: 'Pilih Fitur yang akan di-test (atau "all" untuk semua)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - box
          - item
          - settings
          - onboarding
          - scanner

jobs:
  # ==========================================
  # 1. CODE QUALITY & TYPESCRIPT CHECK
  # ==========================================
  typecheck:
    name: Code & TypeScript Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify TypeScript Compilation (Zero Errors)
        run: npx tsc --noEmit

  # ==========================================
  # 2. ANDROID EMULATOR E2E TESTS (ON DEMAND)
  # ==========================================
  test-android:
    name: Android Emulator Tests
    needs: [typecheck]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Download Kotakin APK from GitHub Releases
        run: |
          mkdir -p apps
          curl -L -o apps/kotakin.apk https://github.com/fraharjo/kotakin-mobile-automation/releases/download/v1.0.0/kotakin.apk

      - name: Run Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            TARGET_FEATURE="${{ github.event.inputs.feature }}"
            if [ -n "$TARGET_FEATURE" ] && [ "$TARGET_FEATURE" != "all" ]; then
              npm run "test:feature:$TARGET_FEATURE"
            else
              npm run test:android
            fi
        continue-on-error: true

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: ignore

  # ==========================================
  # 3. GENERATE ALLURE REPORT ARTIFACT
  # ==========================================
  report:
    name: Generate Allure Report
    needs: [test-android]
    if: github.event_name == 'workflow_dispatch' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: reports/allure-results

      - name: Install Dependencies
        run: npm install

      - name: Generate Allure Report
        run: npm run report:generate

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: reports/allure-report
