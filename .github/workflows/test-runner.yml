name: Kotakin Mobile E2E Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      feature:
        description: 'Pilih Fitur yang akan di-test (atau "all" untuk semua)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - box
          - item
          - settings
          - onboarding
          - scanner
      apk_url:
        description: 'URL Download File APK (Wajib diisi untuk eksekusi emulator CI)'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CODE QUALITY & TYPESCRIPT CHECK
  # ==========================================
  typecheck:
    name: Code & TypeScript Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation (Zero Errors)
        run: npm run typecheck

  # ==========================================
  # 2. ANDROID EMULATOR E2E TESTS (ON DEMAND)
  # ==========================================
  test-android:
    name: Android Emulator Tests
    needs: [typecheck]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK_URL: ${{ inputs.apk_url }}
      TARGET_FEATURE: ${{ inputs.feature }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm ci

      - name: Prepare APK from URL
        run: |
          if [ -z "$APK_URL" ]; then
            echo "::error::apk_url wajib diisi. Silakan peroleh APK resmi dari https://bmolab.web.id/kotakin"
            exit 1
          fi
          mkdir -p apps
          echo "📥 Mengunduh APK dari: $APK_URL"
          curl -fL -o apps/kotakin.apk "$APK_URL"
          test -s apps/kotakin.apk

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: bash scripts/ci-run.sh

      - name: Generate Allure Report
        if: always()
        run: npm run report:generate

      - name: Upload Allure Report HTML Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: reports/allure-report
          if-no-files-found: ignore
