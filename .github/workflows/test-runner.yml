name: Nexus Multi-Stream E2E Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_stream:
        description: 'Pilih Stream yang akan di-test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth
          - catalog
          - checkout
      platform:
        description: 'Pilih Platform'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - android

jobs:
  # ==========================================
  # 1. WEB AUTOMATION TEST RUNNER
  # ==========================================
  test-web:
    if: inputs.platform == 'web' || inputs.platform == '' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Web Automation (Stream: ${{ inputs.target_stream || 'all' }})
        run: |
          if [ "${{ inputs.target_stream }}" = "auth" ]; then
            npm run test:stream:auth
          elif [ "${{ inputs.target_stream }}" = "catalog" ]; then
            npm run test:stream:catalog
          elif [ "${{ inputs.target_stream }}" = "checkout" ]; then
            npm run test:stream:checkout
          else
            npm run test:web -- --cucumberOpts.tagExpression="@automated"
          fi
        continue-on-error: true

      - name: Upload Web Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: reports/allure-results

  # ==========================================
  # 2. ANDROID EMULATOR TEST RUNNER
  # ==========================================
  test-android:
    if: inputs.platform == 'android'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm ci

      - name: Download Sample APK for CI
        run: |
          mkdir -p apps
          curl -L -o apps/my-demo-app.apk https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk

      - name: Run Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: npm run test:android -- --cucumberOpts.tagExpression="@automated and @android"
        continue-on-error: true

      - name: Upload Android Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: reports/allure-results

  # ==========================================
  # 3. MERGE ALLURE REPORT & PUBLISH TO GITHUB PAGES
  # ==========================================
  publish-dashboard:
    needs: [test-web, test-android]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Generate Unified Allure Report
        run: |
          npm ci
          mkdir -p merged-results
          find all-results/ -name "*.json" -o -name "*.png" -o -name "*.txt" | xargs -I {} cp {} merged-results/ || true
          npx allure generate merged-results --clean -o ./allure-report

      - name: Deploy Allure Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
